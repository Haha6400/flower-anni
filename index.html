<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Dancing+Script:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles/card.css">
  <script type="module" src="scripts/main.js"></script>
</head>
<body>
  <!-- Shared flower shapes -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="calla" viewBox="0 0 60 150">
      <path d="M30 120 C 18 112, 10 100, 8 86 C 20 92, 28 102, 31 112 Z" fill="#5F7D45"/>
      <path d="M31 150 C 30 120, 28 95, 33 66" fill="none" stroke="#4E6B3A" stroke-width="3" stroke-linecap="round"/>
      <path d="M33 70 C 12 64, 2 36, 14 8 C 22 22, 40 24, 56 14 C 58 40, 50 62, 33 70 Z" fill="currentColor"/>
      <path d="M33 70 C 22 60, 18 40, 22 22 C 30 30, 42 28, 52 20 C 50 42, 44 60, 33 70 Z" fill="#000" fill-opacity=".16"/>
      <path d="M33 58 C 32 46, 31 36, 30 28" fill="none" stroke="#E8C66A" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <symbol id="anthurium" viewBox="0 0 70 140">
      <path d="M35 140 C 34 110, 36 80, 35 62" fill="none" stroke="#4E6B3A" stroke-width="3" stroke-linecap="round"/>
      <path d="M35 66 C 22 74, 4 66, 4 46 C 4 26, 22 18, 35 34 C 48 18, 66 26, 66 46 C 66 66, 48 74, 35 66 Z" fill="currentColor"/>
      <path d="M35 34 C 26 26, 14 30, 12 42" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
      <path d="M35 50 C 38 34, 44 22, 50 14" fill="none" stroke="#F1E3C0" stroke-width="4" stroke-linecap="round"/>
    </symbol>
  </svg>

  <!-- Full-screen background video, faded in from the record scene -->
  <div class="bg-video" aria-hidden="true">
    <video muted loop playsinline preload="none"></video>
  </div>

  <div class="card" data-state="sealed">
    <main class="stage">
      <div class="canvas">

        <!-- Scenes 0–4: envelope, letter, photos -->
        <section class="scene scene-envelope">

          <div class="obj envelope">
            <div class="env-back"></div>

            <div class="obj flap" aria-hidden="true">
              <svg viewBox="0 0 36 17" preserveAspectRatio="none">
                <path d="M0 0 L36 0 L19.2 16.3 Q18 17.2 16.8 16.3 Z" fill="#F7F3EA" stroke="#000" stroke-opacity=".08" stroke-width=".2"/>
              </svg>
            </div>

            <article class="obj letter" data-action="letter">
              <h1 class="letter-greeting" data-bind="letter.greeting"></h1>
              <p class="letter-subtitle" data-bind="letter.subtitle"></p>
              <p class="letter-body" data-bind="letter.body"></p>
            </article>

            <div class="obj polaroid" data-action="photos" data-i="0" style="--i:0"><div class="photo"><img data-img="photos.0" alt=""></div></div>
            <div class="obj polaroid" data-action="photos" data-i="1" style="--i:1"><div class="photo"><img data-img="photos.1" alt=""></div></div>
            <div class="obj polaroid" data-action="photos" data-i="2" style="--i:2"><div class="photo"><img data-img="photos.2" alt=""></div></div>

            <div class="obj main-photo" data-action="mainPhoto">
              <span class="corner" aria-hidden="true"></span>
              <div class="photo"><img data-img="mainPhoto" alt=""></div>
            </div>

            <svg class="pocket" viewBox="0 0 36 30" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <linearGradient id="pocket-fill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#F6F2E9"/>
                  <stop offset="1" stop-color="#E9E2D2"/>
                </linearGradient>
              </defs>
              <path d="M0 0 L18 16 L36 0 L36 30 L0 30 Z" fill="url(#pocket-fill)"/>
              <path d="M0 30 L17 15.5 M36 30 L19 15.5" stroke="#000" stroke-opacity=".07" stroke-width=".2"/>
              <path d="M0 0 L18 16 L36 0" fill="none" stroke="#000" stroke-opacity=".1" stroke-width=".25"/>
            </svg>

          </div>

          <div class="obj flower flower-left" aria-hidden="true">
            <svg viewBox="-20 -20 120 210">
              <use href="#calla" x="-4" y="22" width="40" height="100" transform="rotate(-24 16 70)" color="#EFE9DC"/>
              <use href="#calla" x="28" y="44" width="46" height="115" transform="rotate(18 50 100)" color="#8A1E30"/>
              <use href="#calla" x="8" y="2" width="60" height="150" transform="rotate(-6 38 80)" color="#6E1424"/>
            </svg>
          </div>
          <div class="obj flower flower-right" aria-hidden="true">
            <svg viewBox="-20 -20 110 180">
              <use href="#calla" x="34" y="30" width="36" height="90" transform="rotate(22 52 75)" color="#EFE9DC"/>
              <use href="#anthurium" x="0" y="0" width="70" height="140" color="#C98BB0"/>
            </svg>
          </div>

          <div class="obj seal" data-action="seal">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <path d="M50 4 C 64 3, 72 10, 82 14 C 94 22, 97 36, 96 50 C 98 64, 92 78, 82 86 C 72 95, 60 97, 48 96 C 34 98, 22 92, 14 84 C 5 74, 3 62, 4 50 C 3 36, 8 22, 18 14 C 28 6, 38 5, 50 4 Z" fill="#7A1F2B"/>
              <circle cx="50" cy="50" r="31" fill="#6A1925" stroke="#8E2A38" stroke-width="2.5"/>
              <path d="M50 50 c 4 -2, 6 3, 2 6 c -6 4, -12 -2, -8 -8 c 6 -8, 18 -4, 18 6 c 0 12, -16 16, -24 8 c -10 -10, -2 -26, 12 -26 c 14 0, 24 12, 20 26" fill="none" stroke="#9A3442" stroke-width="2.5" stroke-linecap="round"/>
              <ellipse cx="34" cy="26" rx="12" ry="6" transform="rotate(-30 34 26)" fill="#fff" fill-opacity=".14"/>
            </svg>
          </div>

          <p class="obj cover-title" data-bind="coverTitle"></p>
          <p class="obj photos-caption" data-bind="photosCaption"></p>
        </section>

        <!-- Scene 5: record -->
        <section class="scene scene-music">
          <div class="obj m-calla" aria-hidden="true">
            <svg viewBox="0 0 60 150"><use href="#calla" width="60" height="150" color="#6E1424"/></svg>
          </div>

          <div class="obj record" data-action="record">
            <div class="record-disc">
              <svg viewBox="0 0 200 200" aria-hidden="true">
                <circle cx="100" cy="100" r="99" fill="#141414"/>
                <g fill="none" stroke="#2B2B2B" stroke-width=".8">
                  <circle cx="100" cy="100" r="92"/><circle cx="100" cy="100" r="85"/>
                  <circle cx="100" cy="100" r="78"/><circle cx="100" cy="100" r="71"/>
                  <circle cx="100" cy="100" r="64"/><circle cx="100" cy="100" r="57"/>
                  <circle cx="100" cy="100" r="50"/><circle cx="100" cy="100" r="43"/>
                </g>
                <circle cx="100" cy="100" r="36" fill="#7A1F2B"/>
                <circle cx="100" cy="100" r="33" fill="none" stroke="#F3EEE3" stroke-opacity=".35" stroke-width=".6"/>
                <text class="record-title" x="100" y="90" text-anchor="middle" data-bind="music.title"></text>
                <circle cx="100" cy="100" r="3" fill="#F3EEE3"/>
              </svg>
            </div>
            <div class="record-sheen" aria-hidden="true"></div>
          </div>

          <div class="obj notes" aria-hidden="true">
            <svg viewBox="0 0 60 44">
              <g fill="#F3EEE3">
                <ellipse cx="10" cy="34" rx="5" ry="3.6" transform="rotate(-20 10 34)"/>
                <rect x="14" y="8" width="1.6" height="26"/>
                <path d="M15.6 8 C 22 12, 24 16, 21 22 C 22 17, 19 14, 15.6 13 Z"/>
                <ellipse cx="34" cy="30" rx="5" ry="3.6" transform="rotate(-20 34 30)"/>
                <ellipse cx="50" cy="26" rx="5" ry="3.6" transform="rotate(-20 50 26)"/>
                <rect x="38" y="6" width="1.6" height="24"/>
                <rect x="54" y="2" width="1.6" height="24"/>
                <path d="M38 6 L55.6 2 L55.6 6 L38 10 Z"/>
              </g>
            </svg>
          </div>

          <div class="obj m-photo">
            <div class="m-photo-back"></div>
            <div class="m-photo-back m-photo-back-2"></div>
            <div class="m-photo-front"><div class="photo"><img data-img="mainPhoto" alt=""></div></div>
            <svg class="clip" viewBox="0 0 20 30" aria-hidden="true">
              <path d="M6 2 v18 a4 4 0 0 0 8 0 V5 a2.6 2.6 0 0 0 -5.2 0 v14" fill="none" stroke="#B8BCC0" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>

          <div class="obj m-lily" data-action="lily">
            <svg viewBox="-20 -20 110 170" aria-hidden="true">
              <use href="#calla" x="22" y="10" width="46" height="115" transform="rotate(16 45 70)" color="#F0EBDF"/>
              <use href="#calla" x="0" y="0" width="50" height="125" transform="rotate(-10 25 60)" color="#F6F2E9"/>
            </svg>
          </div>

          <p class="obj m-caption" data-bind="music.caption"></p>
        </section>

        <!-- Scene 6: gift flower -->
        <section class="scene scene-gift">
          <div class="obj gift-flower">
            <div class="gift-sway">
              <svg class="gift-svg" viewBox="0 0 200 200" aria-hidden="true">
                <defs>
                  <path id="petal" d="M100 100 C 82 86, 64 60, 70 36 C 76 18, 94 14, 100 22 C 106 14, 124 18, 130 36 C 136 60, 118 86, 100 100 Z"/>
                </defs>
                <g class="petals"></g>
              </svg>
              <p class="gift-text" data-bind="gift.text" tabindex="-1"></p>
            </div>
          </div>
        </section>

      </div>
    </main>

    <p class="hint" aria-live="polite">
      <svg class="hint-arrow" viewBox="0 0 40 20" aria-hidden="true">
        <path d="M2 14 C 12 4, 26 4, 36 10 M30 5 L36 10 L29 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="hint-text"></span>
    </p>
  </div>

  <!-- Gift view extras: falling blossoms (behind the card) and the countdown -->
  <div class="blossoms" aria-hidden="true"></div>

  <section class="countdown" aria-hidden="true">
    <p class="countdown-caption" data-bind="countdown.caption"></p>
    <div class="countdown-units" role="timer">
      <div class="cd-unit"><span class="cd-num" data-unit="days">0</span><span class="cd-label" data-bind="countdown.labels.days"></span></div>
      <div class="cd-unit"><span class="cd-num" data-unit="hours">00</span><span class="cd-label" data-bind="countdown.labels.hours"></span></div>
      <div class="cd-unit"><span class="cd-num" data-unit="minutes">00</span><span class="cd-label" data-bind="countdown.labels.minutes"></span></div>
      <div class="cd-unit"><span class="cd-num" data-unit="seconds">00</span><span class="cd-label" data-bind="countdown.labels.seconds"></span></div>
    </div>
  </section>

  <button class="btn-back" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span data-bind="labels.back"></span>
  </button>

  <button class="btn-sound" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
      <path class="icon-off" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path class="icon-on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <audio class="song" preload="none" loop></audio>
</body>
</html>
